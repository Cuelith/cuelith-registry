name: CLA

# Accordo di contribuzione: chi propone una modifica lo accetta una volta, con
# un commento sulla sua prima pull request. Le firme stanno nel ramo
# `cla-signatures` di questo repo. Testo: https://github.com/Cuelith/.github/blob/main/CLA.md
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Accordo di contribuzione
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # v2.6.1, fissata all'impronta: il flusso gira con permessi di scrittura.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Cuelith/.github/blob/main/CLA.md
          branch: cla-signatures
          allowlist: MattiaLazzari,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: Thank you for your contribution. Before it can be reviewed, please read the [Contributor License Agreement](https://github.com/Cuelith/.github/blob/main/CLA.md) and accept it by posting the comment below. You keep the copyright on your work.
          custom-allsigned-prcomment: All contributors have accepted the Contributor License Agreement. Thank you.
          lock-pullrequest-aftermerge: false
